name: superficie-de-ataque · estrategia de recon
goal_kind: attack_surface
targets: ["example.com"]
expected:
  must_include:
    - subdomain_enumeration
    - port_discovery
    - service_detection
    - web_probe
    - vuln_template_scan
  must_exclude:
    - smb_enumeration
    - ad_enumeration
  must_precede:
    - [subdomain_enumeration, port_discovery]
    - [port_discovery, web_probe]
    - [web_probe, vuln_template_scan]
rationale: >-
  A estrategia de superficie de ataque enumera subdominios antes de portas, portas
  antes de web, e roda templates de vulnerabilidade (nuclei) por ultimo, por serem
  lentos. Ordem canonica do pipeline. Nao inclui SMB/AD sem uma descoberta que os
  justifique — a decisao inicial e sobria.
