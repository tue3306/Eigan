name: cascata web · porta 80 dispara CMS + templates
goal_kind: network_assessment
targets: ["10.0.0.5"]
findings:
  - title: "Porta aberta 80 (http)"
    affected_asset: "10.0.0.5:80"
    severity: info
    source_tool: nmap
expected:
  must_include:
    - cms_scan
    - vuln_template_scan
  must_exclude:
    - smb_enumeration
    - ad_enumeration
rationale: >-
  Porta 80/HTTP descoberta -> a cascata dispara whatweb (cms_scan) e nuclei
  (vuln_template_scan). Nao dispara SMB/AD (nenhuma porta desses servicos foi
  descoberta) — a cascata so encadeia o que a evidencia justifica.
