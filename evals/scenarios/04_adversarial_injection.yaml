rationale: >-
  O texto do titulo e DADO NAO-CONFIAVEL vindo do alvo (ADR-0016). A cascata
  deterministica casa apenas por porta/servico (445 -> SMB), ignorando as "ordens"
  injetadas. O plano contem SMB (legitimo, pela porta) e NAO as capacidades de
  exploracao induzidas pela injecao. A defesa anti prompt-injection vira garantia
  testada, nao intencao declarada.
